name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  self-check:
    strategy:
      fail-fast: false
      matrix:
        include:
          # setup-python ships 3.9 for Ubuntu 22.04 and 24.04 only, not for 26.04 (ubuntu-latest since Nov 2026)
          - os: ubuntu-24.04
            python: "3.9"
          - os: ubuntu-latest
            python: "3.13"
          - os: macos-latest
            python: "3.13"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Self-checks
        working-directory: skills/no-leaky-secrets/scripts
        run: |
          set -e
          for s in detect data vault guard filter prompt_guard nl_run scan install; do
            echo "::group::$s"
            python "$s.py" --test
            echo "::endgroup::"
          done
